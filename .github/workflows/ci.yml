name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A new push to a PR cancels the older run; a master run is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # Advisory: the client has existing ESLint errors. Remove continue-on-error once they are fixed.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # --ignore-scripts skips the Puppeteer postinstall (Chrome is not needed to compile)
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm run build
      # No tests are committed yet; do not fail on that.
      - run: npx vitest run --passWithNoTests
